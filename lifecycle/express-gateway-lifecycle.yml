description: >-
  Versioning, release, deprecation and support posture for Express Gateway. This
  is self-hosted open-source software, so several lifecycle surfaces a hosted
  vendor would publish (status page, SLA, sunset headers on a live API) do not
  apply — the operator runs the gateway and owns its uptime.
maturity: dormant
maturity_evidence: >-
  Last npm release 1.16.11 on 2021-04-29; last tagged GitHub release v1.16.9 on
  2019-09-22; official Docker `latest` tag last pushed 2021-04-29; documentation
  site stamped v1.16.3 with a 2021 copyright footer; 78 open issues. The
  repository is NOT archived and was last pushed 2024-05-14, and npm still serves
  ~6,300 downloads a month, so the project is dormant rather than formally
  retired. Its former commercial sponsor, LunchBadger, is gone — the privacy
  policy the site footer still links to (https://www.lunchbadger.com/privacy/)
  returns HTTP 522.
versioning:
  scheme: semver
  policy_url: https://github.com/ExpressGateway/express-gateway/releases
  in_api: false
  detail: >-
    The runtime is versioned with semantic versioning (48 published versions since
    2017-06-29). The Admin API itself carries no version segment or version
    header — the gateway build you installed decides its shape.
releases:
