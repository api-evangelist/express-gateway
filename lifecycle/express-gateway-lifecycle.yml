  see: changelog/express-gateway-changelog.yml
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  detail: >-
    No deprecation policy, no notice period, and no RFC 8594 Sunset/Deprecation
    header support is documented. Deprecation is handled ad hoc in release notes
    and in the docs: the `headers` policy is labelled "(deprecated)" in the
    policies reference in favour of the request/response transformer policies, and
    v1.16.3 removed the undocumented `plugins` admin endpoint outright. Because
    there is no published policy, no `Deprecation` pointer is emitted in apis.yml.
  deprecated_items:
  - item: headers policy
    status: deprecated
    replacement: request-transformer / response-transformer policies
    evidence: https://www.express-gateway.io/docs/policies/headers/
  - item: plugins admin endpoint
    status: removed
    removed_in: 1.16.3
    evidence: https://github.com/ExpressGateway/express-gateway/releases
status_page:
