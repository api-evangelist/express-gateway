- version: 1.16.7
  date: '2019-07-13'
  source: github-release
  breaking: false
  fixed:
  - system.config.yml schema now requires the Redis `namespace` parameter, with a default, instead of crashing.
  - Expired OAuth 2.0 codes return the correct message rather than a JavaScript error (#930).
  changed:
  - Windows CI restored.
- version: 1.16.6
  date: '2019-06-22'
  source: github-release
  breaking: false
  fixed:
  - Windows and macOS added to the test matrix via Azure Pipelines (#921).
  - JSON Schema validation condition now resolves external schema references.
- version: 1.16.4
  date: '2019-06-01'
  source: github-release
  breaking: false
  fixed:
  - SNI tests rewritten for correct callback ordering, fixing Node 12 CI (#915).
  changed:
  - Dependencies upgraded, including Express.js; Node 12 support added.
  - New OAuth 2.0 consent page (#907).
- version: 1.16.3
  date: '2019-04-14'
  source: github-release
  breaking: true
  fixed:
  - Content is now streamed back correctly after JSON Schema validation (#900).
  - Identity-server bugs fixed by community contributions (#899, #901).
  changed:
  - Removed the undocumented `plugins` admin endpoint (#900) — a removal from the Admin API surface.
  - Policies are now lazily loaded, improving startup time.
