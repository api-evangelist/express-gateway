description: >-
  Express Gateway publishes no plans and no pricing. It is free, open-source
  software under Apache-2.0 that an operator downloads and runs on their own
  infrastructure — there is no hosted tier, no account, no signup, and no meter.
  https://www.express-gateway.io/pricing/ returns HTTP 404 and no pricing page
  exists anywhere on the site or in the repository.
plan_count: 0
plans: []
pricing_model: open-source
license: Apache-2.0
license_url: https://github.com/ExpressGateway/express-gateway/blob/master/LICENSE
cost_note: >-
  The only costs are the operator's own — the infrastructure the gateway runs on
  and the Redis instance it uses as its data store. Express Gateway charges
  nothing and bills nobody.
commercial_backing:
  sponsor: LunchBadger
  status: gone
  detail: >-
    Express Gateway was created and sponsored by LunchBadger, which offered
    commercial hosting around it. LunchBadger is no longer operating — the privacy
    policy the express-gateway.io footer still links to,
    https://www.lunchbadger.com/privacy/, returns HTTP 522. No commercial offering
    around Express Gateway survives.
supersedes: >-
  This file replaces a bulk-sweep scaffold dated 2026-05-04 that invented three
  tiers (Free / Professional / Enterprise) with a 1,000-request monthly quota, a
  10 rpm free limit and TBD overage pricing. None of that was ever published by
  Express Gateway. Recording plan_count 0 is the honest measurement; the scaffold
  was a fabrication and has been removed.
