description: >-
  First-party published distributions for Express Gateway. Express Gateway is
  self-hosted open-source software (Apache-2.0), so the packages below are the
  PRODUCT ITSELF and its plugins — the gateway runtime, its bundled `eg` CLI, and
  the official Docker image. There is no client SDK for the Admin API in any
  registry; the CLI ships inside the main npm package and is the only first-party
  client of that API.
note: >-
  Every first-party package on this list is dormant. The npm runtime last shipped
  1.16.11 on 2021-04-29, the official Docker `latest` tag was pushed the same day,
  and both official plugins last released in March 2019. The npm package still
  serves ~6,300 downloads a month (last-month window ending 2026-09-06), so the
  decay is in publishing, not in consumption.
sdk_note: >-
  No `SDKs` pointer is emitted in apis.yml. These are runtime and plugin
  distributions, not client libraries for consuming the Admin API, and claiming
  otherwise would credit Express Gateway with an SDK surface it does not publish.
