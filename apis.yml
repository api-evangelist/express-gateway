aid: express-gateway
name: Express Gateway
description: >-
  Express Gateway is an open-source (Apache-2.0) microservices and serverless API
  gateway built on Express.js and Node.js. Operators install it themselves and
  compose policies — key auth, OAuth 2.0, JWT, CORS, rate limiting, request and
  response transforms, proxying — into pipelines declared in a single YAML config,
  fronting their own downstream services. Its own HTTP surface is the Admin API,
  which manages users, applications, credentials, scopes, schemas, policies,
  endpoints and pipelines, and which binds by default to localhost:9876 rather
  than to any host the project runs. The project is dormant: the last release
  reached npm in April 2021.
