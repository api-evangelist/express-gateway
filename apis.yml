  note: >-
    Corrected 2026-09-07. The GitHub API reports the repository licence as
    Apache-2.0 and the runtime is distributed on npm and Docker Hub, so
    open_source is true, not false. There is no vendor-operated host: the Admin
    API's documented default binding is http://localhost:9876. Commercial backing
    ended with LunchBadger, whose site now returns 522.
