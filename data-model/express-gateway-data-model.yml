  evidence: https://www.express-gateway.io/docs/admin/apps/
- name: Credential
  description: >-
    A container for a consumer's authentication or authorization secrets. Three
    types are provided by the authorization policies — basic-auth (password),
    key-auth (keyId/keySecret pair) and oauth2 (client secret or user password).
    A consumer may hold only ONE basic-auth and ONE oauth2 credential, but MANY
    key-auth credentials.
  path: /credentials
  identifier: id
  composite_key:
  - type
  - id
  note: Addressed as /credentials/{type}/{id}.
  types:
