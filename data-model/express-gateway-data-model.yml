  - key-auth
  - oauth2
  evidence: https://www.express-gateway.io/docs/admin/credentials/
- name: Scope
  description: >-
    A free-form tag used for permissions. Marks API endpoints and is granted to
    credentials. The scope string is its own identifier.
  path: /scopes
  identifier: scope
  identifier_format: string
  evidence: https://www.express-gateway.io/docs/admin/scopes/
- name: Token
  description: >-
    OAuth 2.0 access and refresh tokens issued by the gateway. Managed through the
    CLI (`eg tokens revoke`) and configured in system.config.yml, not through a
